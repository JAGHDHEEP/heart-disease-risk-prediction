# Brings up both faces of the project:
#   - FastAPI prediction service on :8000  (docs at /docs)
#   - Streamlit demo UI        on :8501
# Usage:  docker compose up --build
services:
  api:
    build: .
    image: heart-disease-api
    ports:
      - "8000:8000"
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000

  webapp:
    build: .
    image: heart-disease-api
    ports:
      - "8501:8501"
    command: streamlit run app/streamlit_app.py --server.address 0.0.0.0 --server.port 8501
