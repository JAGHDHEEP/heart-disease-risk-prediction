[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "heart-disease-risk-prediction"
version = "1.0.0"
description = "Leakage-free heart-disease risk prediction with XGBoost, SHAP, FastAPI and Streamlit."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.setuptools.packages.find]
where = ["src"]

# "src" makes the `heart` package importable; "." makes the root-level
# `api` and `app` packages importable for the API smoke tests.
[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "api", "app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E731"]

# FastAPI uses callables (File, Depends, Query, ...) as argument defaults by
# design; treat them as immutable so B008 doesn't flag the idiom.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.File",
    "fastapi.Form",
    "fastapi.Body",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Cookie",
    "fastapi.Depends",
]
